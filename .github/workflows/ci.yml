name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Detekt (design system, compose-rules, style)
        run: ./gradlew detekt
      - name: Custom rule tests
        run: ./gradlew :detekt-rules:test
      - name: Compile Android
        run: ./gradlew :androidApp:compileDebugKotlin
